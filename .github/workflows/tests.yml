# 每個 PR（跟併進 main 之後）自動跑後端 pytest 跟前端 vitest。
# 後端跑 tests/ 底下不需要 OPENAI_API_KEY、帳密、data/ 的測試（設定在 pytest.ini），
# tests/manual/ 要真的帳密才能跑，留給本機。
name: 測試

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一個 PR 推了新的 commit，就取消還在跑的舊版本
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 後端（pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: 安裝套件
        run: python -m pip install -r requirements.txt
      - name: 安裝 Playwright 的 Chromium（tests/test_registration_login.py 用）
        run: python -m playwright install --with-deps chromium
      - name: 跑測試
        run: python -m pytest

  frontend:
    name: 前端（vitest）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安裝套件
        run: npm ci
      - name: 跑測試
        run: npm test
