<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NCUXplore 校園助手</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%236d28d9%22/><g transform=%22translate(20 21) scale(2.5)%22 fill=%22white%22><path d=%22M12 2.5 1.5 8 12 13.5 22.5 8 12 2.5Z%22/><path opacity=%22.6%22 d=%22M5.5 10.6v4.65c0 .38.17.73.47.96C7.2 17.4 9.6 19 12 19s4.8-1.6 6.03-2.79c.3-.23.47-.58.47-.96V10.6L12 15.1 5.5 10.6Z%22/><path d=%22M21.25 9v6.2%22 stroke=%22white%22 stroke-width=%221.4%22 stroke-linecap=%22round%22/></g></svg>" />
    <meta name="theme-color" content="#6d28d9" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("ncuxplore_theme");
          var resolved =
            mode === "dark" || mode === "light"
              ? mode
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          // localStorage/matchMedia 不可用就維持預設（CSS 的 light 預設值）。
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
